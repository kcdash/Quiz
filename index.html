<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Quiz</title>
<link rel="stylesheet" href="style.css">
<style>
  main { min-height: 100%; max-width: 560px; margin: 0 auto; padding: 1.2em 1.1em 1.2em; display: flex; flex-direction: column; gap: 1em; }
  section { flex: 1; display: flex; flex-direction: column; gap: 1em; }
  .center { justify-content: center; align-items: center; text-align: center; }
  h1 { font-size: 2.1rem; margin: .6em 0 0; }
  .big { font-family: var(--display); font-size: 2.4rem; font-weight: 800; line-height: 1.1; }
  #pill { align-self: center; display: flex; align-items: center; gap: .5em; padding: .35em .9em; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); font-size: .9rem; font-weight: 700; max-width: 100%; }
  #pill span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #pill.off { border-color: var(--bad); color: var(--bad); }
  #code { text-transform: uppercase; letter-spacing: .2em; text-align: center; font-size: 1.4rem; font-weight: 700; }
  #join button { padding: 1em; font-size: 1.1rem; }
  #err { color: #ffc2bb; min-height: 1.3em; }
  #tick { width: 5.5rem; height: 5.5rem; border-radius: 50%; background: var(--good); color: #06331c; display: grid; place-items: center; font-size: 3rem; font-weight: 800; }
  .who { display: flex; justify-content: space-between; gap: 1em; font-size: .9rem; color: var(--mute); }
  #qtext { font-size: 1.15rem; font-weight: 700; line-height: 1.3; }
  #btns { flex: 1; display: grid; gap: .7em; grid-auto-rows: 1fr; }
  #btns button { display: flex; align-items: center; gap: .8em; text-align: left; color: #fff; font-size: 1.1rem; font-weight: 700; padding: .8em 1em; min-height: 4.2em; border-radius: 14px; }
  #btns button.picked { outline: 4px solid #fff; }
  #btns button.faded { opacity: .3; }
  .result { border-radius: 16px; padding: 1.4em; width: 100%; }
  .result.good { background: #0f5132; } .result.bad { background: #6b1f24; } .result.none { background: var(--panel); }
</style>
</head>
<body>
<div id="demo" class="banner demo hidden">REHEARSAL MODE</div>
<main>
  <div id="pill" class="hidden"><i class="dot"></i><span id="pillText"></span></div>

  <section id="join">
    <h1>Join the quiz</h1>
    <label for="code" class="mute">Game code</label>
    <input type="text" id="code" maxlength="5" autocomplete="off" autocapitalize="characters">
    <label for="name" class="mute">Team name</label>
    <input type="text" id="name" maxlength="20" autocomplete="off">
    <div id="err"></div>
    <button id="go">Join</button>
    <button id="back" class="ghost hidden">This is my team – ask the host to let this phone in</button>
  </section>

  <section id="wait" class="center hidden">
    <div id="tick" class="hidden">✓</div>
    <div class="big" id="waitBig"></div>
    <div class="mute" id="waitSub"></div>
  </section>

  <section id="play" class="hidden">
    <div class="who"><span id="rn"></span><span id="qn"></span></div>
    <div class="bar"><i id="tbar"></i></div>
    <div id="qtext"></div>
    <div id="btns"></div>
    <div class="mute" id="note" style="text-align:center;min-height:1.4em"></div>
  </section>

  <section id="res" class="center hidden">
    <div class="result" id="resBox">
      <div class="big" id="resBig"></div>
      <div id="resPts" style="font-size:1.25rem;font-weight:700;margin-top:.4em"></div>
    </div>
    <div style="font-size:1.2rem" id="resLine">Total <b id="resTotal">0</b> · Rank <b id="resRank">–</b></div>
  </section>
</main>

<script src="config.js"></script>
<script src="store.js"></script>
<script>
const $ = id => document.getElementById(id), esc = Quiz.esc, L = Quiz.LETTERS;
let S, code, pid, name, state = null, score = null, joined = false, online = true, picks = {}, sending = false;
const checked = {};
// ?tab=2, ?tab=3… lets one browser act as several phones (rehearsal only)
const TAB = new URLSearchParams(location.search).get('tab') || '';
const DEVKEY = 'quizdev/' + TAB;
const dev = localStorage.getItem(DEVKEY) || Quiz.newId('d');
localStorage.setItem(DEVKEY, dev);
const key = () => 'quizplayer/' + code + '/' + TAB;
const path = p => `games/${code}/${p}`;
const show = id => ['join', 'wait', 'play', 'res'].forEach(s => $(s).classList.toggle('hidden', s !== id));
const savePlayer = () => localStorage.setItem(key(), JSON.stringify({ pid, name, picks }));
const fmt = n => Number(n || 0).toLocaleString('en-CA');

function pill() {
  $('pill').classList.toggle('hidden', !joined);
  $('pill').classList.toggle('off', !online);
  $('pill').querySelector('.dot').classList.toggle('off', !online);
  $('pillText').textContent = online ? `Connected as ${name}` : 'Connection lost – reconnecting…';
}
function render() {
  pill();
  if (!joined) return show('join');
  const p = state && state.phase;
  if (!state || p === 'lobby') return wait("You're in!", `${name} is connected. Look for your team name on the big screen.`, true);
  if (p === 'intro' || p === 'rules') return wait('Eyes on the screen', 'The quiz is about to start.');
  if (p === 'round') return wait(state.roundName || 'Next round', state.roundNote || 'Get ready.');
  if (p === 'show') return wait('Eyes on the screen', 'Answers open in a moment.');
  if (p === 'open' && !(state.q && state.q.choices && state.startAt)) return wait('Get ready…', '');
  if (p === 'open') return renderPlay();
  if (p === 'final') return renderFinal();
  renderResult();
}
function wait(big, sub, tick) {
  show('wait'); $('tick').classList.toggle('hidden', !tick);
  $('waitBig').textContent = big; $('waitSub').textContent = sub;
}
function renderPlay() {
  show('play');
  const q = state.q, mine = picks[state.qi], left = state.startAt + q.time * 1000 - S.now(), over = left <= 0;
  $('rn').textContent = state.roundName ? state.roundName + (state.roundNote ? ` (${state.roundNote})` : '') : '';
  $('qn').textContent = `Q${state.qi + 1} of ${state.total} · up to ${fmt(q.max)}`;
  $('qtext').textContent = q.text;
  $('btns').innerHTML = Object.values(q.choices).map((c, i) =>
    `<button data-c="${L[i]}" class="ch-${L[i]} ${mine === L[i] ? 'picked' : (mine || over) ? 'faded' : ''}" ${mine || over ? 'disabled' : ''}><span class="letter">${L[i]}</span><span>${esc(c)}</span></button>`).join('');
  $('note').textContent = mine ? `Locked in: ${mine}. Your answer is recorded.` : over ? "Time's up!" : '';
  tick();
}
function renderResult() {
  show('res');
  const mine = picks[state.qi], q = state.q || {};
  const has = score && score.total != null, fresh = has && score.qi === state.qi, pts = fresh ? score.last : 0;
  const ok = mine && mine === state.correct;
  const right = state.correct ? `${state.correct}: ${Object.values(q.choices || {})[L.indexOf(state.correct)] || ''}` : '';
  $('resBox').className = 'result ' + (ok ? 'good' : mine ? 'bad' : 'none');
  $('resBig').textContent = ok ? 'Correct!' : mine ? 'Not this time' : 'No answer';
  $('resPts').textContent = ok ? `+${fmt(pts)} points · ${right}` : `The answer was ${right}`;
  $('resLine').classList.remove('hidden');
  $('resTotal').textContent = has ? fmt(score.total) : 0;
  $('resRank').textContent = has ? score.rank : '–';
}
function renderFinal() {
  // Don't spoil the podium: the phone shows the final rank only once the winner is on the big screen.
  if ((state.finalStep || 0) < 3) return wait('Quiz over!', 'Watch the big screen for the winners.');
  show('res');
  const has = score && score.total != null;
  $('resBox').className = 'result none';
  $('resBig').textContent = has ? `You finished #${score.rank}` : 'Quiz over!';
  $('resPts').textContent = has ? `${fmt(score.total)} points` : '';
  $('resLine').classList.add('hidden');
}
let wasOver = false;
function tick() {
  if (!joined || !state || state.phase !== 'open' || !state.q || !state.startAt) return;
  const total = state.q.time * 1000, left = state.startAt + total - S.now();
  $('tbar').style.transform = `scaleX(${Math.max(0, Math.min(1, left / total))})`;
  const over = left <= 0;
  if (over !== wasOver) { wasOver = over; renderPlay(); }
}
setInterval(tick, 100);

// If this phone has no record of an answer for the open question, ask the server before allowing a tap.
// Covers a team that was moved to a new phone, or a phone whose saved data was cleared.
async function syncPick(qi) {
  if (picks[qi] || checked[qi]) return;
  checked[qi] = true;
  const got = await S.get(path(`answers/${qi}/${pid}`)).catch(() => null);
  if (got && got.c) { picks[qi] = got.c; savePlayer(); render(); }
}

$('btns').onclick = async e => {
  const b = e.target.closest('button'); if (!b || b.disabled || sending) return;
  const qi = state.qi, c = b.dataset.c;
  sending = true; picks[qi] = c; savePlayer(); renderPlay();
  try { await S.set(path(`answers/${qi}/${pid}`), { c, t: S.TS }); }
  catch (err) {
    // A rejected write normally means an answer is already recorded; show the recorded one.
    const got = await S.get(path(`answers/${qi}/${pid}`)).catch(() => null);
    if (got) picks[qi] = got.c; else delete picks[qi];
    savePlayer();
    if (state.phase === 'open' && state.qi === qi) { renderPlay(); if (!got) $('note').textContent = 'Could not send – tap again.'; }
  }
  sending = false;
};

function announce() {            // tell the host screen this phone is online; the server clears it if we drop
  if (!joined || !online) return;
  const p = path(`presence/${pid}/${dev}`);
  Promise.resolve(S.goneOnDisconnect(p)).then(() => S.set(p, true)).catch(() => {});
}
function leave(msg) {
  localStorage.removeItem(key());
  sessionStorage.setItem('quizmsg', msg);
  location.href = location.pathname + '?code=' + code + (TAB ? '&tab=' + TAB : '');
}
function enter() {
  if (joined) return;
  joined = true;
  S.on(path('state'), v => {
    if (v && state && v.qi !== state.qi) wasOver = false;
    state = v;
    if (v && (v.phase === 'open' || v.phase === 'show')) syncPick(v.qi);
    render();
  });
  S.on(path('scores/' + pid), v => { score = v; render(); });
  let seen = false;
  S.on(path('players/' + pid), v => {
    if (v) {
      seen = true;
      if (v.dev && v.dev !== dev) leave('This team is now playing on another phone.');
      return;
    }
    if (seen) leave('The host removed this team. You can join again.');
  });
  announce();
  if (navigator.wakeLock) {
    const lock = () => navigator.wakeLock.request('screen').catch(() => {});
    lock(); document.addEventListener('visibilitychange', () => { if (!document.hidden) lock(); });
  }
  render();
}
async function join() {
  code = $('code').value.trim().toUpperCase(); name = $('name').value.trim().replace(/\s+/g, ' ');
  $('back').classList.add('hidden');
  if (code.length < 4) return $('err').textContent = 'Enter the game code shown on the screen.';
  if (!name) return $('err').textContent = 'Enter a team name.';
  $('go').disabled = true; $('err').textContent = '';
  try {
    if (!(await S.get(path('meta')))) throw new Error('No game with that code. Check the screen and try again.');
    const saved = JSON.parse(localStorage.getItem(key()) || 'null');
    pid = (saved && saved.pid) || Quiz.newId('p');
    picks = (saved && saved.picks) || {};
    let free;
    try { free = await S.claim(path('names/' + Quiz.nameKey(name)), pid); }
    catch (e) {                       // older database rules without the names list: fall back to comparing names
      const others = (await S.get(path('players'))) || {};
      free = !Object.keys(others).some(id => id !== pid && Quiz.nameKey(others[id].name) === Quiz.nameKey(name));
    }
    if (!free) {
      $('back').classList.remove('hidden');
      throw new Error('That team name is already in the game. Pick another name, or use the button below if it is your team.');
    }
    await S.set(path('players/' + pid), { name, at: S.TS, dev });
    savePlayer();
    history.replaceState(null, '', '?code=' + code + (TAB ? '&tab=' + TAB : ''));
    enter();
  } catch (e) { $('err').textContent = e.message; $('go').disabled = false; }
}
let asking = false;
async function askBack() {
  $('back').disabled = true;
  try {
    await S.set(path('rejoin/' + dev), { name, at: S.TS });
    $('err').textContent = 'Asked the host. Keep this page open.';
    if (asking) return; asking = true;
    S.on(path('rejoin/' + dev), v => {
      if (!v || v.ok === undefined || joined) return;
      S.remove(path('rejoin/' + dev));
      $('back').disabled = false;
      if (v.ok && v.pid) {
        pid = v.pid; name = v.name || name; picks = {};
        savePlayer(); history.replaceState(null, '', '?code=' + code + (TAB ? '&tab=' + TAB : ''));
        enter();
      } else if (v.ok) { join(); }                      // the name was free after all
      else { $('err').textContent = 'The host did not let this phone in. Pick another team name.'; $('go').disabled = false; }
    });
  } catch (e) { $('err').textContent = 'Could not reach the host. Try again.'; $('back').disabled = false; }
}
$('go').onclick = join;
$('back').onclick = askBack;
$('name').onkeydown = e => { if (e.key === 'Enter') join(); };

(async function boot() {
  $('demo').classList.toggle('hidden', Quiz.LIVE); document.body.classList.toggle('demo', !Quiz.LIVE);
  const urlCode = (new URLSearchParams(location.search).get('code') || '').toUpperCase();
  $('code').value = urlCode;
  const msg = sessionStorage.getItem('quizmsg');
  if (msg) { $('err').textContent = msg; sessionStorage.removeItem('quizmsg'); }
  try { S = await Quiz.connect(); }
  catch (e) { $('err').textContent = 'Could not connect. Check your internet connection and reload.'; $('go').disabled = true; return; }
  S.onConnection(ok => { online = ok; pill(); announce(); });
  // Returning player (page refresh, phone went to sleep): rejoin silently.
  code = urlCode;
  const saved = code && JSON.parse(localStorage.getItem(key()) || 'null');
  const rec = saved && (await S.get(path('players/' + saved.pid)).catch(() => null));
  if (rec && (!rec.dev || rec.dev === dev)) {
    ({ pid, name, picks } = saved); picks = picks || {};
    return enter();
  }
  (urlCode ? $('name') : $('code')).focus();
})();
</script>
</body>
</html>
